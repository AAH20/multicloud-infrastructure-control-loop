[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multicloud-infrastructure-control-loop"
version = "0.1.0"
description = "Cost-aware, blast-radius-scored remediation compiler for multi-cloud infrastructure findings"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ahmed Hassan"}]
keywords = ["multi-cloud", "platform-engineering", "terraform", "opentofu", "kubernetes", "finops", "compliance-as-code", "cloud-security"]

[project.scripts]
control-loop = "control_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
